<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEFFGALLERY Admin Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background-color: black;
  color:white;
  padding:40px;
}

h1{
  color: #ebac00;
  text-align:center;
  margin-bottom:40px;
  font-size:40px;
} 

h5{
  text-align:center;
  margin-bottom:40px;
  font-size:40px;
}

p{
  text-align:center;
  margin-bottom:40px;
  font-size:40px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
}

.card{
  background:#1b1b1b;
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(231, 158, 1, 0.2);
  text-align:center;
}

.card h2{
  font-size:22px;
  margin-bottom:15px;
  color:#ff8800;
}

.number{
  font-size:50px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>JEFFGALLERY Dashboard</h1>
<h5>Welcome</h5>
<p>C.E.O</p> <br>

<div class="dashboard">

  <div class="card">
    <h2>Total Visitors</h2>
    <div class="number" id="visitors">0</div>
  </div>

  <div class="card">
    <h2>Total Downloads</h2>
    <div class="number" id="downloads">0</div>
  </div>

</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCghzssgZv-EgxhB8jVLcTK7CYUNNIL11Q",
  authDomain: "jeffgallery-45ac1.firebaseapp.com",
  projectId: "jeffgallery-45ac1",
  storageBucket: "jeffgallery-45ac1.appspot.com",
  messagingSenderId: "415183494170",
  appId: "1:415183494170:web:7153457b83407a16e905a3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const statsRef = doc(db, "jeffgallery", "8CHgXo5VtsJvnjcmfCKT");

// SAFE INIT (creates doc if missing)
async function initStats() {
  const snap = await getDoc(statsRef);

  if (!snap.exists()) {
    await setDoc(statsRef, {
      visitors: 0,
      downloads: 0
    });
  }
}

// VISITOR (safe + no crash)
async function addVisitor() {
  try {
    await updateDoc(statsRef, {
      visitors: increment(1)
    });
  } catch (e) {
    console.error("Visitor update failed:", e);
  }
}

// LOAD DATA
async function loadStats() {
  const snap = await getDoc(statsRef);

  if (!snap.exists()) return;

  const data = snap.data();

  document.getElementById("visitors").innerText = data.visitors || 0;
  document.getElementById("downloads").innerText = data.downloads || 0;
}

// DOWNLOAD TRACKER
window.addDownload = async function () {
  try {
    await updateDoc(statsRef, {
      downloads: increment(1)
    });

    loadStats();
  } catch (e) {
    console.error("Download update failed:", e);
  }
};

// START
(async function start() {
  await initStats();
  await addVisitor();
  await loadStats();
})();
</script>

</body>
</html>
