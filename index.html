<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JEFFGALLERY</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      overflow-x:hidden;
    }

    /* HEADER */
    #header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:20px 6%;
      background:#fff;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:1000;
    }

    #header h1{
      color:#000;
      font-size:28px;
      font-weight:bold;
    }

    #nav{
      display:flex;
      align-items:center;
      gap:25px;
    }

    #nav li{
      list-style:none;
      position:relative;
    }

    #nav li a{
      text-decoration:none;
      color:black;
      font-size:20px;
      transition:0.3s ease;
    }

    #nav li a:hover,
    #nav li a.active{
      color:rgb(3,137,255);
    }

    #nav li a.active::after,
    #nav li a:hover::after{
      content:"";
      width:100%;
      height:2px;
      background:rgb(3,137,255);
      position:absolute;
      left:0;
      bottom:-6px;
    }

    /* HERO */
    #hero{
      background-image:url(3k7qjv.jpg);
      min-height:100vh;
      width:100%;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      padding:120px 6% 60px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      color:white;
    }

    #hero h4{
      font-size:22px;
      margin-bottom:10px;
    }

    #hero h1{
      color:rgb(4,168,168);
      font-size:70px;
      margin-bottom:15px;
    }

    #hero h3{
      font-size:30px;
      margin-bottom:10px;
    }

    #hero h5{
      color:rgb(223,31,31);
      font-size:20px;
      margin-bottom:20px;
    }

    #btn{
      width:130px;
      height:45px;
      border:none;
      border-radius:6px;
      background:rgb(35,172,165);
      transition:0.3s ease;
      cursor:pointer;
    }

    #btn a{
      text-decoration:none;
      color:white;
      font-size:16px;
      font-weight:bold;
    }

    #btn:hover{
      background:rgb(34,231,231);
      transform:scale(1.05);
    }

    #btn:active{
      background:rgb(2,100,87);
    }

    /* FOOTER */
    .footer{
      background:#050505;
      color:#fff;
      padding:60px 20px 20px;
      border-top:1px solid rgba(0,255,255,0.2);
      box-shadow:0 -5px 30px rgba(0,255,255,0.05);
    }

    .footer-container{
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      max-width:1100px;
      margin:auto;
      gap:40px;
    }

    .footer-brand h2{
      color:#00f7ff;
      text-shadow:0 0 10px #00f7ff;
      margin-bottom:10px;
    }

    .footer-brand p{
      color:#bbb;
      max-width:280px;
      line-height:1.6;
    }

    .footer-links h3,
    .footer-social h3{
      color:#00f7ff;
      margin-bottom:15px;
    }

    .footer-links a{
      display:block;
      color:#bbb;
      text-decoration:none;
      margin:8px 0;
      transition:0.3s;
    }

    .footer-links a:hover{
      color:#00f7ff;
      text-shadow:0 0 8px #00f7ff;
    }

    .icons{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .icons a{
      width:42px;
      height:42px;
      display:flex;
      justify-content:center;
      align-items:center;
      border:1px solid #00f7ff;
      border-radius:50%;
      color:#00f7ff;
      transition:0.3s;
      box-shadow:0 0 8px rgba(0,255,255,0.2);
      text-decoration:none;
    }

    .icons a:hover{
      background:#00f7ff;
      color:#000;
      box-shadow:0 0 15px #00f7ff;
      transform:translateY(-3px);
    }

    .footer-bottom{
      text-align:center;
      margin-top:40px;
      border-top:1px solid rgba(255,255,255,0.1);
      padding-top:15px;
      color:#777;
      font-size:14px;
    }

    /* TABLET */
    @media (max-width:992px){

      #hero h1{
        font-size:55px;
      }

      #hero h3{
        font-size:24px;
      }
    }

    /* MOBILE */
    @media (max-width:768px){

      #header{
        flex-direction:column;
        gap:15px;
        padding:15px 5%;
      }

      #header h1{
        font-size:24px;
      }

      #nav{
        gap:20px;
      }

      #nav li a{
        font-size:18px;
      }

      #hero{
        text-align:center;
        align-items:center;
        padding:140px 20px 60px;
      }

      #hero h1{
        font: size 30px;
      }

      #hero h3{
        font: size 20px;
      }

      #hero h4{
        font: size 15px;
      }

      #hero h5{
        font: size 16px;
      }

      .footer-container{
        flex-direction:column;
        text-align:center;
        align-items:center;
      }

      .footer-brand p{
        max-width:100%;
      }

      .icons{
        justify-content:center;
      }
    }

    /* SMALL MOBILE */
    @media (max-width:480px){

      #hero h1{
        font-size:34px;
      }

      #hero h3{
        font-size:18px;
      }

      #btn{
        width:120px;
        height:42px;
      }

      #btn a{
        font-size:15px;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <section id="header">
    <h1>JEFFGALLERY.</h1>

    <ul id="nav">
      <li>
        <a class="active" href="index.html">
          <i class="fa-solid fa-house"></i>
        </a>
      </li>

      <li>
        <a href="contact.html">
          <i class="fa-solid fa-phone"></i>
        </a>
      </li>

      <li>
        <a href="about.html">
          <i class="fa-solid fa-circle-info"></i>
        </a>
      </li>
    </ul>
  </section>

  <!-- HERO -->
  <section id="hero">
    <h4 style="color: #000;">Welcome To</h4>

    <h1>JEFFGALLERY.</h1>

    <h3 style="color: #000;">Download Background Images For Free</h3>

    <h5>90% Free Download</h5>

    <button id="btn">
      <a href="dashboard.html">Visit</a>
    </button>
  </section>

  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-container">

      <div class="footer-brand">
        <h2>JEFFGALLERY</h2>
        <p>
          Discover and download beautiful free HD images for your projects.
        </p>
      </div>

      <div class="footer-links">
        <h3>Quick Links</h3>

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="policy.html">Privacy Policy</a>
      </div>

      <div class="footer-social">
        <h3>Follow Us</h3>

        <div class="icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>

          <a href="#"><i class="fab fa-instagram"></i></a>

          <a href="#"><i class="fab fa-twitter"></i></a>

          <a href="#"><i class="fab fa-whatsapp"></i></a>
        </div>
      </div>

    </div>

    <div class="footer-bottom">
      <p>© 2026 JEFFGALLERY. All rights reserved.</p>
    </div>

  </footer>

</body>
</html>
