<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jeffgallery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<style>
  *{
    margin: 0%;
    padding: 0%;
    box-sizing: border-box;
  }

  #header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 80px;
    background-color: rgb(255, 254, 254);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
    position: fixed;
    height: auto;
    width: 220vh;

  }

  /* responsive */
@media(max-width:768px){
  #header{
    flex-direction:column;
    padding:0 25px;
  }
}
  
  #header h1{
    color: rgb(0, 0, 0);
    font-weight: larger;
  }

  #nav{
    display: flex;
    align-items: center;
    justify-content:space-between;

  }

  #nav li{
    list-style: none;
    padding: 0 20px;
    position: relative;
    margin-right:50px;
  }

  #nav li a{
    text-decoration: none;
    color: black;
    transition:0.3 ease ;
  }

   #nav li a:hover,
   #nav li a.active{
  color: rgb(3, 137, 255);
   }

    #nav li a.active::after,
    #nav li a:hover::after{
      content: "";
      width: 30%;
      height: 2px;
      background: rgb(3, 137, 255);
      position: absolute;
      bottom: -4px;
      left:20px
    }

    #hero{
      background-image: url(3k7qjv.jpg);
      height: 100vh;
      width: 100%;
      background-size: cover;
      background-repeat: no-repeat;
      padding: 0 80px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      font-size: larger;
      font-weight: bold;
      font-family: sans-serif;
    }


    #hero h1{
      color: rgb(4, 168, 168);
    }
    #hero h5{
      color:rgb(223, 31, 31)
    }

    #btn{
      border-radius: 4px;
      border: none;
      width: 60px;
      height: 40px;
      background-color: rgb(35, 172, 165);
      color: whitesmoke;
      transition: 0.3 ease;
    }

    #btn:hover{
      background-color: rgb(34, 231, 231);
      color: aliceblue;
      transform: scale(1.03);
    }

    #btn:active{
      background-color: rgb(2, 100, 87);
      color: white;
      transition: 0.3 ease;
    }
    #btn a{
      text-decoration: none;
      color: whitesmoke;
    }


.footer{
  background:#050505;
  color:#fff;
  padding:60px 20px 20px;
  margin-top:50px;
  border-top:1px solid rgba(0,255,255,0.2);
  box-shadow:0 -5px 30px rgba(0,255,255,0.05);
  font-family: Arial, sans-serif;
}

.footer-container{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  max-width:1100px;
  margin:auto;
  gap:30px;
}

.footer-brand h2{
  color:#00f7ff;
  text-shadow:0 0 10px #00f7ff;
  margin-bottom:10px;
}

.footer-brand p{
  color:#bbb;
  max-width:250px;
  line-height:1.5;
}

.footer-links h3,
.footer-social h3{
  color:#00f7ff;
  margin-bottom:10px;
}

.footer-links a{
  display:block;
  color:#bbb;
  text-decoration:none;
  margin:6px 0;
  transition:0.3s;
}

.footer-links a:hover{
  color:#00f7ff;
  text-shadow:0 0 8px #00f7ff;
}

.icons{
  display:flex;
  gap:15px;
  margin-top:10px;
}

.icons a{
  width:40px;
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  border:1px solid #00f7ff;
  border-radius:50%;
  color:#00f7ff;
  transition:0.3s;
  box-shadow:0 0 8px rgba(0,255,255,0.2);
}

.icons a:hover{
  background:#00f7ff;
  color:#000;
  box-shadow:0 0 15px #00f7ff;
  transform:translateY(-3px);
}

.footer-bottom{
  text-align:center;
  margin-top:40px;
  border-top:1px solid rgba(255,255,255,0.1);
  padding-top:15px;
  color:#777;
  font-size:14px;
}





/* responsive */
@media(max-width:768px){
  .footer-container{
    flex-direction:column;
    padding:0 25px;
  }
}

</style>
<body>
  <section id="header">
    <h1>JEFFGALLERY.</h1>
    <div>
      <ul id="nav">
        <li><a class="active"><i class="fa-solid fa-house"></i></i></a> </li>
        <li><a href="contact.html"><i class="fa-solid fa-phone"></i></a></li>
        <li><a href="about.html"><i class="fa-solid fa-circle-info"></i></a></li>
      </ul>
    </div>
  </section>

  <section id="hero">
    <h4>Welcome To</h4>
    <h1>JEFFGALLERY.</h1>
    <h3>Download background Images For Free</h3>
    <h5>90% Free download</h5><br>
    <button id="btn"> <a href="dashboard.html">Visit</button>
  </section>

<footer class="footer">
  <div class="footer-container">

    <div class="footer-brand">
      <h2>JEFFGALLERY</h2>
      <p>Discover and download beautiful free HD images for your projects.</p>
    </div>

    <div class="footer-links">
      <h3>Quick Links</h3>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="policy.html">Privacy Policy</a>
    </div>

    <div class="footer-social">
      <h3>Follow Us</h3>

      <div class="icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="youtube.com"><i class="fab fa-whatsapp"></i></a>
      </div>

    </div>

  </div>

  <div class="footer-bottom">
    <p>© 2026 JEFFGALLERY. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
