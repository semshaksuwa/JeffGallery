<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jeffgallery</title>
</head>
<style>
  *{
    margin: 0%;
    padding: 0%;
    box-sizing: border-box;
  }

  #header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 80px;
    background-color: rgb(190, 190, 190);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
    position: fixed;
    height: auto;
    width: 220vh;

  }
  
  #header h1{
    color: rgb(0, 0, 0);
    font-weight: larger;
  }

  #nav{
    display: flex;
    align-items: center;
    justify-content: space-between;

  }

  #nav li{
    list-style: none;
    padding: 0 20px;
    position: relative;
  }

  #nav li a{
    text-decoration: none;
    color: black;
    transition:0.3 ease ;
  }

   #nav li a:hover,
   #nav li a.active{
  color: rgb(3, 137, 255);
   }

    #nav li a.active::after,
    #nav li a:hover::after{
      content: "";
      width: 30%;
      height: 2px;
      background: rgb(3, 137, 255);
      position: absolute;
      bottom: -4px;
      left:20px
    }

    #hero{
      background-image: url(3k7qjv.jpg);
      height: 100vh;
      width: 100%;
      background-size: cover;
      background-repeat: no-repeat;
      padding: 0 80px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      font-size: larger;
      font-weight: bold;
      font-family: sans-serif;
    }


    #hero h1{
      color: rgb(4, 168, 168);
    }
    #hero h5{
      color:rgb(223, 31, 31)
    }

    #btn{
      border-radius: 4px;
      border: none;
      width: 50px;
      height: 30px;
      background-color: rgb(35, 172, 165);
      color: whitesmoke;
      transition: 0.3 ease;
    }

    #btn:hover{
      background-color: rgb(34, 231, 231);
      color: aliceblue;
    }

    #btn:active{
      background-color: rgb(2, 100, 87);
      color: white;
      transition: 0.3 ease;
    }
    #btn a{
      text-decoration: none;
      color: whitesmoke;
    }

</style>
<body>
  <section id="header">
    <h1>JEFFGALLERY.</h1>
    <div>
      <ul id="nav">
        <li><a class="active">Home</a> </li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </div>
  </section>

  <section id="hero">
    <h4>Welcome To</h4>
    <h1>JEFFGALLERY.</h1>
    <h3>Download background Images For Free</h3>
    <h5>90% Free download</h5><br>
    <button id="btn"> <a href="dashboard.html">Visit</button>
  </section>
</body>
</html>
