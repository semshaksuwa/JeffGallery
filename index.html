    *{

  padding:0;
  box-sizing:border-box;

body{
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

/* HEADER */
#header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 6%;
  background:#fff;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}

#header h1{
  color:#000;
  font-size:28px;
  font-weight:bold;
}

#nav{
  display:flex;
  align-items:center;
  gap:25px;
}

#nav li{
  list-style:none;
  position:relative;
}

#nav li a{
  text-decoration:none;
  color:black;
  font-size:20px;
  transition:0.3s ease;
}

/* HERO */
#hero{
  background-image:url(3k7qjv.jpg);
  min-height:100vh;
  width:100%;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  padding:140px 6% 60px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:40px;

  flex-wrap:wrap;
}

/* LEFT TEXT */
.hero2{
  flex:1;
  min-width:280px;
}

.hero2 h1{
  font-size:60px;
  color:#05b0b6;
}

.hero2 h3{
  font-size:24px;
  color:#000;
}

.hero2 h4{
  color:#000;
  font-size:18px;
}

.hero2 h5{
  color:red;
  font-size:18px;
}

/* BUTTON */
#btn{
  width:140px;
  height:50px;
  border:none;
  border-radius:6px;
  background:rgb(35,172,165);
  cursor:pointer;
  transition:0.3s;
}

#btn a{
  text-decoration:none;
  color:white;
  font-size:16px;
  font-weight:bold;
}

#btn:hover{
  transform:scale(1.05);
}

/* IMAGE SECTION */
.hero1{
  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;

  flex-wrap:wrap;

  background:rgba(255,255,255,0.9);

  padding:25px;
  border-radius:20px;

  box-shadow:#019297 0px 0px 20px;

  min-width:280px;
}

/* IMAGE BOX */
.image-box{
  width:100%;
  max-width:280px;
  height:280px;
  transition:1.0ms

  border-radius:30px;
  overflow:hidden;

  background:#ddd;

  box-shadow:#01a7a7 0px 0px 20px;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image-box:hover{
  transform:scale(1.05);
  box-shadow:#05b0b6 0px 0px 30px;
}

/* FOOTER */
.footer{
  background: linear-gradient(135deg,#000,#0d0d0d,#111);
  color:#fff;
  padding:70px 8% 25px;
  margin-top:50px;
  border-top:2px solid #05b0b6;
}

/* CONTAINER */
.footer-container{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:50px;
  max-width:1200px;
  margin:auto;
}

/* BRAND */
.footer-brand{
  flex:1;
  min-width:250px;
}

.footer-brand h2{
  font-size:32px;
  color:#05b0b6;
  margin-bottom:15px;
}

.footer-brand p{
  line-height:1.8;
  color:#ccc;
  font-size:16px;
}

/* LINKS */
.footer-links{
  flex:1;
  min-width:200px;
}

.footer-links h3{
  margin-bottom:20px;
  font-size:22px;
  color:#05b0b6;
}

.footer-links a{
  display:block;
  text-decoration:none;
  color:#ddd;
  margin-bottom:12px;
  transition:0.3s ease;
  font-size:16px;
}

.footer-links a:hover{
  color:#05b0b6;
  transform:translateX(6px);
}

/* SOCIAL */
.footer-social{
  flex:1;
  min-width:220px;
}

.footer-social h3{
  margin-bottom:20px;
  font-size:22px;
  color:#05b0b6;
}

/* ICONS */
.icons{
  display:flex;
  gap:15px;
  margin-top:10px;
}

.icons a{
  width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:20px;
  transition:0.3s ease;
  backdrop-filter:blur(5px);
  border:1px solid rgba(255,255,255,0.1);
}

.icons a:hover{
  background:#05b0b6;
  transform:translateY(-5px) scale(1.08);
  box-shadow:0 0 20px #05b0b6;
}

/* BOTTOM */
.footer-bottom{
  margin-top:50px;
  border-top:1px solid rgba(255,255,255,0.1);
  padding-top:20px;
  text-align:center;
}

.footer-bottom p{
  color:#aaa;
  font-size:15px;
  letter-spacing:1px;
}

/* RESPONSIVE */
@media (max-width:768px){

  .footer{
    text-align:center;
  }

  .footer-container{
    flex-direction:column;
    align-items:center;
  }

  .icons{
    justify-content:center;
  }

  .footer-brand h2{

  }

/* TABLET */
@media (max-width:992px){

  }

/* MOBILE */

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCghzssgZv-EgxhB8jVLcTK7CYUNNIL11Q",
  authDomain: "jeffgallery-45ac1.firebaseapp.com",
  projectId: "jeffgallery-45ac1",
  storageBucket: "jeffgallery-45ac1.appspot.com",
  messagingSenderId: "415183494170",
  appId: "1:415183494170:web:7153457b83407a16e905a3"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Firestore document reference
const statsRef = doc(db, "jeffgallery", "8CHgXo5VtsJvnjcmfCKT");

// Count visitor only once per session
async function addVisitor() {

  const visited = sessionStorage.getItem("visited");

  if (visited) return;

  sessionStorage.setItem("visited", "true");

  try {

    const snap = await getDoc(statsRef);

    // create document if missing
    if (!snap.exists()) {
      await setDoc(statsRef, {
        visitors: 1,
        downloads: 0
      });

      return;
    }

    // increment visitors
    await updateDoc(statsRef, {
      visitors: increment(1)
    });

  } catch (error) {
    console.error("Visitor tracking failed:", error);
  }
}

// Start tracking
addVisitor();
</script>
